[package]
name = "star_rail_metadata_reconstructor"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
byteorder = "1.5"
rayon = "1.10"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
iced-x86 = { version = "1.21", default-features = false, features = ["std", "decoder"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
